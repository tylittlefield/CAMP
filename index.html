<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAMP — Map</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="map-page">
    <div class="map-wrapper">
      <img src="" alt="Camp Map" class="map-img" id="mapImg">

      <!-- Clickable hotspots, positioned as % of image -->
      <a href="peaks-collection.html"    class="hotspot peaks"    style="left:21%; top:18%; width:18%; height:22%;" data-name="Peaks Collection"></a>
      <a href="explorer-collection.html" class="hotspot explorer" style="left:24%; top:30%; width:12%; height:18%;" data-name="Explorer Collection"></a>
      <a href="wildlife-collection.html" class="hotspot wildfire" style="left:54%; top:8%;  width:20%; height:30%;" data-name="Wildlife Collection"></a>
      <a href="base-camp-collection.html" class="hotspot basecamp" style="left:38%; top:55%; width:14%; height:16%;" data-name="Base Camp"></a>
      <a href="sea-collection.html"      class="hotspot sea"      style="left:5%;  top:75%; width:20%; height:20%;" data-name="Sea Collection"></a>

      <!-- Map overlay buttons -->
      <div class="map-buttons">
        <a href="shop.html" class="map-btn shop-btn">Shop All</a>
        <a href="signin.html" class="map-btn signin-btn">Sign In</a>
      </div>

      <!-- Arrow to next page -->
      <a href="explore.html" class="next-arrow" aria-label="Explore trails">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </a>
    </div>

    <!-- Label tooltip that follows clicks -->
    <div class="label-tag" id="labelTag"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
