<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAMP — Forgot Password</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Archivo:wght@500;600;700&display=swap');
  :root{--olive:#A9B36C;--olive-light:#C2CC8E;--olive-dark:#3A3C1C;--cream:#F0EDD9;--tan:#D8D2BF;--ink:#2A2A1E;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{font-family:'Cormorant Garamond',serif;background:var(--olive);color:var(--ink);display:flex;flex-direction:column;min-height:100vh;}
  .top-bar{display:flex;align-items:center;justify-content:space-between;padding:20px 28px;background:var(--olive-light);}
  .top-bar a{display:flex;align-items:center;text-decoration:none;color:var(--ink);font-family:'Archivo',sans-serif;font-size:0.8rem;font-weight:600;letter-spacing:0.05em;gap:6px;}
  .top-bar .logo img{height:32px;width:auto;}
  .card-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 20px;}
  .card{background:var(--cream);border-radius:6px;width:100%;max-width:420px;padding:48px 40px 44px;}
  .card-logo{display:flex;justify-content:center;margin-bottom:12px;}
  .card-logo img{height:48px;width:auto;}
  .card-title{text-align:center;font-style:italic;font-weight:500;font-size:2.2rem;line-height:1.1;margin-bottom:8px;}
  .card-sub{text-align:center;font-size:1.1rem;opacity:0.55;margin-bottom:36px;}
  .field{margin-bottom:20px;}
  .field label{display:block;font-family:'Archivo',sans-serif;font-size:0.7rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:7px;opacity:0.65;}
  .field input{width:100%;padding:13px 14px;font-family:'Cormorant Garamond',serif;font-size:1.2rem;background:#fff;border:1.5px solid var(--tan);border-radius:3px;color:var(--ink);outline:none;transition:border-color 0.2s;}
  .field input:focus{border-color:var(--olive-dark);}
  .submit-btn{width:100%;margin-top:28px;padding:16px;background:var(--olive-dark);color:var(--cream);font-family:'Archivo',sans-serif;font-size:0.8rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;border:none;border-radius:3px;cursor:pointer;transition:background 0.2s,transform 0.15s;}
  .submit-btn:hover{background:#2e3010;transform:translateY(-1px);}
  .back-link{display:block;text-align:center;margin-top:20px;font-style:italic;font-size:1.1rem;color:var(--olive-dark);text-decoration:none;opacity:0.8;}
  .back-link:hover{opacity:1;}
  .success-state{display:none;text-align:center;padding:20px 0;}
  .success-state.visible{display:block;}
  .success-icon{font-size:2.5rem;margin-bottom:16px;}
  .success-title{font-style:italic;font-size:1.8rem;margin-bottom:8px;}
  .success-sub{font-size:1.1rem;opacity:0.6;margin-bottom:28px;line-height:1.5;}
  .success-btn{display:inline-block;padding:14px 36px;background:var(--olive-dark);color:var(--cream);font-family:'Archivo',sans-serif;font-size:0.78rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;text-decoration:none;border-radius:3px;}
  @media(max-width:480px){.card{padding:36px 24px 32px;}}
  .camp-chat-fixed{position:fixed;top:18px;right:18px;z-index:9999;display:flex;align-items:center;justify-content:center;width:36px;height:36px;background:#3A3C1C;border:none;border-radius:50%;cursor:pointer;color:#F0EDD9;transition:transform 0.18s;}.camp-chat-fixed:hover{transform:scale(1.08);}.camp-chat-fixed svg{width:17px;height:17px;}
</style>
</head>
<body>
  <button class="camp-chat-fixed" onclick="window.CAMP_CHAT&&window.CAMP_CHAT.toggle()" aria-label="Chat with us"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
  <div class="top-bar">
    <a href="signin.html">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      Sign In
    </a>
    <div class="logo"><a href="index.html"><img src="images/camp-logo-full.png" alt="CAMP"></a></div>
    <div style="width:60px"></div>
  </div>

  <div class="card-wrap">
    <div class="card">
      <div class="card-logo"><img src="images/camp-logo-full.png" alt="CAMP logo"></div>
      <div class="card-title">Reset Password</div>
      <div class="card-sub">Enter your email and we'll send you a reset link.</div>

      <div id="formState">
        <form onsubmit="return false;">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
          </div>
          <button type="submit" class="submit-btn" id="submitBtn" onclick="sendReset()">Send Reset Link</button>
        </form>
        <a href="signin.html" class="back-link">Back to Sign In</a>
      </div>

      <div class="success-state" id="successState">
        <div class="success-icon">&#9993;</div>
        <div class="success-title">Check your email.</div>
        <div class="success-sub">We've sent a password reset link to <strong id="sentTo"></strong>. It may take a minute or two to arrive.</div>
        <a href="signin.html" class="success-btn">Back to Sign In</a>
      </div>
    </div>
  </div>

<script>
  function sendReset() {
    var email = document.getElementById('email').value.trim();
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      document.getElementById('email').focus();
      return;
    }
    var btn = document.getElementById('submitBtn');
    btn.textContent = 'Sending…';
    btn.disabled = true;
    setTimeout(function() {
      document.getElementById('sentTo').textContent = email;
      document.getElementById('formState').style.display = 'none';
      document.getElementById('successState').classList.add('visible');
    }, 900);
  }
</script>

<script src="chat.js"></script>
</body>
</html>
